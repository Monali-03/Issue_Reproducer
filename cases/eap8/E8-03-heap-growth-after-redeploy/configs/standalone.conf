# Excerpt from the customer's EAP_HOME/bin/standalone.conf
JAVA_OPTS="-Xms4096m -Xmx4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
JAVA_OPTS="$JAVA_OPTS -Djava.net.preferIPv4Stack=true"
JAVA_OPTS="$JAVA_OPTS -Djboss.modules.system.pkgs=org.jboss.byteman"
JAVA_OPTS="$JAVA_OPTS -Djava.awt.headless=true"
JAVA_OPTS="$JAVA_OPTS -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/eap/heapdump.hprof"
JAVA_OPTS="$JAVA_OPTS -Xlog:gc*:file=/var/log/eap/gc.log:time,uptime,level,tags:filecount=5,filesize=20M"
